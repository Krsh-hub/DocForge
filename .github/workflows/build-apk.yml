name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Export Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Static Export
        working-directory: ./frontend
        run: npm run build

      - name: Grant Execute Permission to Gradlew
        run: chmod +x frontend/android/gradlew

      - name: Sync Capacitor Android Project
        working-directory: ./frontend
        run: |
          npx cap sync android 2>&1 | tee /tmp/cap_sync.log || {
            echo "### Capacitor Sync Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/cap_sync.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Build Debug APK
        working-directory: ./frontend/android
        run: |
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee /tmp/gradle_build.log || {
            echo "### Gradle Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 /tmp/gradle_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Locate Generated APK
        run: |
          echo "### Finding generated APK files:"
          find frontend/android -name "*.apk"
          find frontend/android -name "*.apk" >> $GITHUB_STEP_SUMMARY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocForge-Android-Debug-APK
          path: frontend/android/**/*.apk
          if-no-files-found: error
          retention-days: 30
